---
update_data_job:
  cron: "<%= "*/5 * * #{ENV["MONTHS"]} *" %>"
  class: "UpdateDataWorker"
update_global_usage_job:
  cron: "<%= "*/30 * * #{ENV["MONTHS"]} *" %>"
  class: "UpdateGlobalUsageWorker"
update_global_usage_monthly_job:
  cron: "0 3 2 * *"
  class: "UpdateGlobalUsageWorker"
update_photos_count_job:
  cron: "<%= "*/5 * * #{ENV["MONTHS"]} *" %>"
  class: "UpdatePhotosCountWorker"
update_analytics_job:
  cron: "<%= "15 2 * #{ENV["MONTHS"]} *" %>"
  class: "UpdateAnalyticsWorker"
update_special_photos_job:
  cron: "<%= "45 1 * #{ENV["MONTHS"]} *" %>"
  class: "Toolforge::UpdateSpecialPhotosWorker"
update_quality_status_monthly_job:
  cron: "0 4 3 * *"
  class: "Toolforge::UpdateQualityStatusWorker"
update_creator_activity_monthly_job:
  cron: "0 5 4 * *"
  class: "Toolforge::UpdateCreatorActivityWorker"
sync_monuments_weekly_job:
  cron: "0 2 * * 0"
  class: "SyncMonumentsWorker"
update_exif_weekly_job:
  cron: "30 3 * * 1"
  class: "Toolforge::UpdateExifWorker"
update_pageviews_monthly_job:
  cron: "0 6 5 * *"
  class: "UpdatePageviewsWorker"
first_wlm_data_population_worker:
  cron: "<%= "30 7 31 #{ENV["MONTH"].to_i - 1} *" %>"
  class: "FirstWlmDataPopulationWorker"
update_nophoto_data_worker:
  cron: "<%= "0 10 * #{ENV["MONTH"]} *" %>"
  class: "UpdateNophotoDataWorker"
delete_nonwlm_photos_worker:
  cron: "<%= "00 23 * #{ENV["MONTHS"]} *" %>"
  class: "DeleteNonwlmPhotosWorker"
download_no_photo_monuments:
  cron: "<%= "0 0 31 #{ENV["MONTH"].to_i - 1} *" %>"
  class: "DownloadNoPhotoMonuments"
